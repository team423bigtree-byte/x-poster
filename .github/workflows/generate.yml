name: Generate X Posts

on:
  # 定時実行: 毎朝7:00 JST (= 22:00 UTC 前日)
  schedule:
    - cron: "0 22 * * *"
  # 手動実行: キーワードを入れて実行できる
  workflow_dispatch:
    inputs:
      keyword:
        description: "テーマキーワード（空欄なら3本柱ミックス）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEYWORD: ${{ github.event.inputs.keyword }}
        run: python scripts/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/posts/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "posts: ${{ github.run_id }}"
            git push
          fi
